					Volver

			</div>
				
		</div>
		<form id="myForm">
		  <div class="mb-3">
		    <label for="exampleInputEmail1" class="form-label">Nombre</label>
		    <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" value="Principiante">
		  </div>


		  <div class="mb-3">
		    <label for="exampleInputQR" class="form-label">Código QR</label>
		    <input type="file" class="form-control" id="exampleInputQR" aria-describedby="telefonoHelp">
		  </div>

		  <div class="mb-3">
		    <label for="exampleInputPDF" class="form-label">PDF Rutina</label>
		    <input type="file" class="form-control" id="exampleInputPDF" aria-describedby="telefonoHelp">
		  </div>
		  
		  <button type="submit" class="btn btn-primary" >Guardar</button>
		  <button type="submit" class="btn btn-danger" >Borrar</button>
		</form>
	</div>
